name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run test:node
      - run: npm run test:deno
      - run: npm run check:syntax
      - run: deno check supabase/functions/telegram/index.ts
      - run: npm run audit:public
        env:
          PERSONAL_OS_PRIVATE_MARKERS: ${{ secrets.PERSONAL_OS_PRIVATE_MARKERS }}
